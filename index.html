<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stroopwafel — KITA Remix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black: #0a0a0a;
  --white: #f5f5f0;
  --yellow: #FCCC0A;
  --blue: #0039A6;
  --red: #EE352E;
  --orange: #FF6319;
  --green: #00933C;
  --purple: #6D2F8E;
  --gray: #A7A9AC;
  --brown: #996633;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; min-height:100vh; background:var(--black); overflow-x:hidden; }

body {
  font-family: 'DM Mono', monospace;
  color: var(--white);
}

#app {
  max-width: 640px;
  margin: 0 auto;
  padding: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* HEADER */
#top-bar {
  background: var(--black);
  border-bottom: 3px solid var(--yellow);
  padding: 14px 20px 12px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}
.release-info h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 2px;
  line-height: 1;
  color: var(--white);
}
.release-info .meta {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--gray);
  text-transform: uppercase;
  margin-top: 3px;
}
.badges {
  display: flex;
  gap: 5px;
  align-items: center;
  padding-top: 4px;
}
.badge {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,0.15);
}

/* SCORE BAR */
#score-bar {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  background: #111;
}
.score-cell {
  padding: 8px 16px;
  text-align: center;
  border-right: 1px solid rgba(255,255,255,0.08);
}
.score-cell:last-child { border-right: none; }
.score-label {
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--gray);
  text-transform: uppercase;
}
.score-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 1px;
  color: var(--yellow);
  line-height: 1.1;
}

/* CANVAS */
#canvas-wrap {
  position: relative;
  width: 100%;
  background: #fff;
  flex: 1;
}
#gc {
  display: block;
  width: 100%;
  height: auto;
}

/* OVERLAY */
#overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.82);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  z-index: 20;
}
#overlay.hidden { display: none; }
.overlay-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px;
  letter-spacing: 4px;
  color: var(--white);
  text-align: center;
  line-height: 1;
}
.overlay-sub {
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--gray);
  text-align: center;
  text-transform: uppercase;
}
.overlay-score {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 52px;
  color: var(--yellow);
  letter-spacing: 2px;
  line-height: 1;
}
#name-input {
  background: transparent;
  border: 1.5px solid var(--yellow);
  color: var(--white);
  font-family: 'DM Mono', monospace;
  font-size: 16px;
  padding: 8px 16px;
  text-align: center;
  width: 200px;
  letter-spacing: 2px;
  outline: none;
}
#name-input::placeholder { color: rgba(255,255,255,0.3); }
#name-input:focus { border-color: var(--white); }

.btn {
  background: var(--yellow);
  color: var(--black);
  border: none;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  letter-spacing: 3px;
  padding: 10px 32px;
  cursor: pointer;
  transition: transform 0.1s;
}
.btn:hover { transform: scale(1.04); }
.btn:active { transform: scale(0.97); }
.btn-ghost {
  background: transparent;
  color: var(--gray);
  border: 1px solid rgba(255,255,255,0.2);
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: 2px;
  padding: 7px 20px;
  cursor: pointer;
}
.btn-ghost:hover { color: var(--white); border-color: var(--white); }

/* LEADERBOARD */
#leaderboard-panel {
  background: #111;
  border-top: 3px solid var(--yellow);
  padding: 16px 20px;
}
.lb-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.lb-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  letter-spacing: 3px;
  color: var(--yellow);
}
.lb-refresh {
  font-size: 10px;
  color: var(--gray);
  letter-spacing: 1px;
  cursor: pointer;
  text-transform: uppercase;
}
.lb-refresh:hover { color: var(--white); }
.lb-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 12px;
}
.lb-row:last-child { border-bottom: none; }
.lb-rank {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  color: var(--gray);
  min-width: 20px;
}
.lb-rank.top { color: var(--yellow); }
.lb-name { flex: 1; color: var(--white); letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-pts {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  color: var(--yellow);
  letter-spacing: 1px;
}
.lb-empty { font-size: 11px; color: var(--gray); letter-spacing: 1px; padding: 8px 0; }

/* AUDIO indicator */
#audio-bar {
  background: var(--black);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding: 5px 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--gray);
  text-transform: uppercase;
}
.audio-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--gray);
  transition: background 0.3s;
}
.audio-dot.playing { background: var(--green); }

/* MOBILE DPAD */
#dpad {
  background: var(--black);
  border-top: 1px solid rgba(255,255,255,0.08);
  padding: 10px;
  display: grid;
  place-items: center;
}
.dpad-grid {
  display: grid;
  grid-template-areas: '. u .' 'l . r' '. d .';
  gap: 4px;
}
.dpad-btn {
  width: 44px; height: 44px;
  background: #1a1a1a;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px;
  color: var(--white);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.dpad-btn:active { background: #333; transform: scale(0.93); }
</style>
</head>
<body>
<div id="app">

  <div id="top-bar">
    <div class="release-info">
      <h1>Stroopwafel</h1>
      <div class="meta">KITA Remix &nbsp;·&nbsp; OUT NOW</div>
    </div>
    <div class="badges">
      <span class="badge" style="background:#EE352E">1</span>
      <span class="badge" style="background:#FF6319">B</span>
      <span class="badge" style="background:#FCCC0A;color:#000">N</span>
      <span class="badge" style="background:#996633">Q</span>
      <span class="badge" style="background:#6D2F8E">7</span>
      <span class="badge" style="background:#808183">S</span>
    </div>
  </div>

  <div id="audio-bar">
    <div class="audio-dot" id="audio-dot"></div>
    <span id="audio-status">loading track...</span>
  </div>

  <div id="score-bar">
    <div class="score-cell">
      <div class="score-label">Score</div>
      <div class="score-val" id="score-val">0</div>
    </div>
    <div class="score-cell">
      <div class="score-label">Speed</div>
      <div class="score-val" id="speed-val">1</div>
    </div>
    <div class="score-cell">
      <div class="score-label">Best</div>
      <div class="score-val" id="best-val">0</div>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="gc"></canvas>
    <div id="overlay">
      <div class="overlay-title">NYC SUBWAY<br>SNAKE</div>
      <div class="overlay-sub">Stroopwafel — KITA Remix</div>
      <button class="btn" id="start-btn">ENTER STATION</button>
      <div class="overlay-sub" style="margin-top:4px">Arrow keys or D-pad below</div>
    </div>
  </div>

  <div id="dpad">
    <div class="dpad-grid">
      <button class="dpad-btn" style="grid-area:u" data-dir="UP">↑</button>
      <button class="dpad-btn" style="grid-area:l" data-dir="LEFT">←</button>
      <button class="dpad-btn" style="grid-area:r" data-dir="RIGHT">→</button>
      <button class="dpad-btn" style="grid-area:d" data-dir="DOWN">↓</button>
    </div>
  </div>

  <div id="leaderboard-panel">
    <div class="lb-header">
      <div class="lb-title">🚇 Top Riders</div>
      <span class="lb-refresh" id="lb-refresh">↻ refresh</span>
    </div>
    <div id="lb-list"><div class="lb-empty">Loading leaderboard...</div></div>
  </div>

</div>

<audio id="track" preload="auto">
  <source src="stroopwafel_kita.mp3" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');

const CELL = 20;
let W, H, COLS, ROWS;

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  W = wrap.clientWidth;
  COLS = Math.floor(W / CELL);
  ROWS = Math.floor(COLS * 0.75);
  H = ROWS * CELL;
  canvas.width = COLS * CELL;
  canvas.height = H;
  canvas.style.width = '100%';
  canvas.style.height = 'auto';
}
resize();

// ── SUBWAY LINES CONFIG ──
const LINES = [
  {l:'1',c:'#EE352E'},{l:'2',c:'#EE352E'},{l:'3',c:'#EE352E'},
  {l:'4',c:'#00933C'},{l:'5',c:'#00933C'},{l:'6',c:'#00933C'},
  {l:'7',c:'#6D2F8E'},
  {l:'A',c:'#0039A6'},{l:'C',c:'#0039A6'},{l:'E',c:'#0039A6'},
  {l:'B',c:'#FF6319'},{l:'D',c:'#FF6319'},{l:'F',c:'#FF6319'},{l:'M',c:'#FF6319'},
  {l:'G',c:'#6CBE45'},
  {l:'J',c:'#996633'},{l:'Z',c:'#996633'},
  {l:'L',c:'#A7A9AC'},
  {l:'N',c:'#FCCC0A'},{l:'Q',c:'#FCCC0A'},{l:'R',c:'#FCCC0A'},{l:'W',c:'#FCCC0A'},
  {l:'S',c:'#808183'},
];

// ── BACKGROUND MAP LINES ──
function getBgLines() {
  const c = COLS, r = ROWS;
  return [
    {pts:[[0,Math.floor(r*0.28)],[c,Math.floor(r*0.28)]],c:'#EE352E',w:6},
    {pts:[[0,Math.floor(r*0.38)],[c,Math.floor(r*0.38)]],c:'#0039A6',w:6},
    {pts:[[0,Math.floor(r*0.62)],[c,Math.floor(r*0.62)]],c:'#FCCC0A',w:5},
    {pts:[[0,Math.floor(r*0.72)],[Math.floor(c*0.55),Math.floor(r*0.72)],[Math.floor(c*0.55),r]],c:'#FF6319',w:5},
    {pts:[[Math.floor(c*0.18),0],[Math.floor(c*0.18),r]],c:'#00933C',w:5},
    {pts:[[Math.floor(c*0.38),0],[Math.floor(c*0.38),Math.floor(r*0.55)],[c,Math.floor(r*0.55)]],c:'#6D2F8E',w:5},
    {pts:[[Math.floor(c*0.62),0],[Math.floor(c*0.62),r]],c:'#6CBE45',w:4},
    {pts:[[Math.floor(c*0.82),0],[Math.floor(c*0.82),Math.floor(r*0.45)],[c,Math.floor(r*0.45)]],c:'#A7A9AC',w:4},
    {pts:[[0,Math.floor(r*0.85)],[Math.floor(c*0.3),Math.floor(r*0.85)],[Math.floor(c*0.3),r]],c:'#996633',w:4},
  ];
}

function drawBg() {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,canvas.width,H);

  const bgLines = getBgLines();
  bgLines.forEach(line => {
    ctx.save();
    ctx.strokeStyle = line.c + '28';
    ctx.lineWidth = line.w * CELL * 0.6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    line.pts.forEach((p,i) => {
      const x = p[0]*CELL + CELL/2;
      const y = p[1]*CELL + CELL/2;
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.stroke();
    ctx.restore();
  });

  // subtle grid
  ctx.strokeStyle = 'rgba(0,0,0,0.04)';
  ctx.lineWidth = 0.5;
  for(let x=0;x<=canvas.width;x+=CELL){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  }
  for(let y=0;y<=H;y+=CELL){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();
  }
}

// ── SNAKE ──
function drawSnake(snake, snakeColor) {
  if(snake.length===0) return;

  // draw body as one continuous rounded path
  ctx.save();
  ctx.strokeStyle = snakeColor;
  ctx.lineWidth = CELL * 0.72;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // body shadow
  ctx.shadowColor = snakeColor + '60';
  ctx.shadowBlur = 4;

  ctx.beginPath();
  snake.forEach((seg,i) => {
    const x = seg.x*CELL + CELL/2;
    const y = seg.y*CELL + CELL/2;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.restore();

  // head dot
  ctx.save();
  const head = snake[0];
  const hx = head.x*CELL+CELL/2, hy = head.y*CELL+CELL/2;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(hx, hy, CELL*0.22, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

// ── FOOD (station badge) ──
function drawFood(food) {
  const x = food.x*CELL+CELL/2;
  const y = food.y*CELL+CELL/2;
  const r = CELL*0.42;

  ctx.save();
  ctx.shadowColor = food.line.c + '80';
  ctx.shadowBlur = 8;
  ctx.fillStyle = food.line.c;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  // border
  ctx.save();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.stroke();
  ctx.restore();

  // label
  ctx.save();
  ctx.fillStyle = food.line.c === '#FCCC0A' ? '#000' : '#fff';
  ctx.font = `bold ${Math.round(CELL*0.45)}px 'Bebas Neue', Helvetica, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(food.line.l, x, y+1);
  ctx.restore();
}

// ── GAME STATE ──
let snake=[], dir={x:1,y:0}, nextDir={x:1,y:0};
let food=null, score=0, highScore=0, speed=1;
let running=false, gameOver=false;
let frame, lastTime=0, elapsed=0;
let snakeColor = '#0039A6';

const SPEED_TABLE = [200,175,155,138,122,108,96,86,78,70];

function getInterval() { return SPEED_TABLE[Math.min(speed-1, SPEED_TABLE.length-1)]; }

function rnd(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }

function pickLine(){ return LINES[Math.floor(Math.random()*LINES.length)]; }

function placeFood(){
  let p;
  do { p={x:rnd(1,COLS-2),y:rnd(1,ROWS-2)}; }
  while(snake.some(s=>s.x===p.x&&s.y===p.y));
  food={...p,line:pickLine()};
}

function initGame(){
  const cx=Math.floor(COLS/2), cy=Math.floor(ROWS/2);
  snake=[{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy},{x:cx-3,y:cy}];
  dir={x:1,y:0}; nextDir={x:1,y:0};
  score=0; speed=1; running=true; gameOver=false;
  snakeColor = '#0039A6';
  placeFood();
  document.getElementById('score-val').textContent='0';
  document.getElementById('speed-val').textContent='1';
}

function update(){
  dir=nextDir;
  const head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||
     snake.some(s=>s.x===head.x&&s.y===head.y)){
    endGame(); return;
  }
  snake.unshift(head);
  if(food && head.x===food.x && head.y===food.y){
    score+=10;
    speed=Math.min(10,1+Math.floor(score/60));
    snakeColor = food.line.c === '#FCCC0A' ? '#0039A6' : food.line.c;
    document.getElementById('score-val').textContent=score;
    document.getElementById('speed-val').textContent=speed;
    playSnippet();
    placeFood();
  } else {
    snake.pop();
  }
}

function loop(ts){
  if(!running) return;
  const dt = ts-lastTime; lastTime=ts;
  elapsed+=dt;
  if(elapsed>=getInterval()){ elapsed=0; update(); }
  if(!running) return;
  drawBg();
  if(food) drawFood(food);
  drawSnake(snake, snakeColor);
  frame=requestAnimationFrame(loop);
}

function endGame(){
  running=false; gameOver=true;
  if(score>highScore){
    highScore=score;
    document.getElementById('best-val').textContent=highScore;
  }
  drawBg();
  if(food) drawFood(food);
  drawSnake(snake,snakeColor);
  showGameOver();
  stopAudio();
}

// ── OVERLAYS ──
const overlay = document.getElementById('overlay');

function showGameOver(){
  overlay.innerHTML = `
    <div class="overlay-sub">DERAILED</div>
    <div class="overlay-score">${score}</div>
    <div class="overlay-sub">pts</div>
    <input id="name-input" class="name-input" placeholder="YOUR NAME" maxlength="20" autocomplete="off" spellcheck="false" style="background:transparent;border:1.5px solid #FCCC0A;color:#f5f5f0;font-family:'DM Mono',monospace;font-size:16px;padding:8px 16px;text-align:center;width:200px;letter-spacing:2px;outline:none;margin-top:4px;">
    <button class="btn" id="submit-score-btn">SAVE SCORE</button>
    <button class="btn-ghost" id="restart-btn" style="background:transparent;color:#A7A9AC;border:1px solid rgba(255,255,255,0.2);font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;padding:7px 20px;cursor:pointer;">PLAY AGAIN</button>
  `;
  overlay.classList.remove('hidden');

  document.getElementById('submit-score-btn').addEventListener('click', ()=>{
    const name = document.getElementById('name-input').value.trim() || 'Anonymous';
    submitScore(name, score);
    overlay.classList.add('hidden');
    startGame();
  });
  document.getElementById('restart-btn').addEventListener('click', ()=>{
    overlay.classList.add('hidden');
    startGame();
  });
}

function startGame(){
  initGame();
  lastTime=0; elapsed=0;
  cancelAnimationFrame(frame);
  startAudio();
  frame=requestAnimationFrame(loop);
}

document.getElementById('start-btn').addEventListener('click', ()=>{
  overlay.classList.add('hidden');
  startGame();
});

// ── CONTROLS ──
document.querySelectorAll('.dpad-btn').forEach(btn=>{
  ['touchstart','mousedown'].forEach(ev=>{
    btn.addEventListener(ev, e=>{
      e.preventDefault();
      const d=btn.dataset.dir;
      if(d==='UP'&&dir.y!==1)    nextDir={x:0,y:-1};
      if(d==='DOWN'&&dir.y!==-1) nextDir={x:0,y:1};
      if(d==='LEFT'&&dir.x!==1)  nextDir={x:-1,y:0};
      if(d==='RIGHT'&&dir.x!==-1)nextDir={x:1,y:0};
    });
  });
});

document.addEventListener('keydown', e=>{
  if(gameOver&&(e.key==='Enter'||e.key===' ')){
    overlay.classList.add('hidden');
    startGame(); return;
  }
  const map={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
  const nd=map[e.key];
  if(!nd) return;
  e.preventDefault();
  if(nd.x!==0&&dir.x===0) nextDir=nd;
  if(nd.y!==0&&dir.y===0) nextDir=nd;
});

// ── AUDIO ──
const audio = document.getElementById('track');
const dot = document.getElementById('audio-dot');
const statusEl = document.getElementById('audio-status');
let audioDuration = 0;

audio.addEventListener('loadedmetadata', ()=>{
  audioDuration = audio.duration;
  statusEl.textContent = 'track ready';
});
audio.addEventListener('error', ()=>{
  statusEl.textContent = 'audio unavailable';
});

function playSnippet(){
  if(!audioDuration) return;
  const start = Math.random()*(audioDuration-12);
  audio.currentTime = start;
  audio.play().catch(()=>{});
  dot.classList.add('playing');
  statusEl.textContent = 'playing...';
  clearTimeout(audio._stopTimer);
  audio._stopTimer = setTimeout(()=>{
    audio.pause();
    dot.classList.remove('playing');
    statusEl.textContent = 'collect a station';
  }, 4500);
}

function startAudio(){
  statusEl.textContent='collect a station';
  dot.classList.remove('playing');
}

function stopAudio(){
  audio.pause();
  clearTimeout(audio._stopTimer);
  dot.classList.remove('playing');
  statusEl.textContent='track ready';
}

// ── LEADERBOARD ──
const API = 'https://YOUR_RAILWAY_URL'; // ← sostituire con URL Railway

async function fetchLeaderboard(){
  const el = document.getElementById('lb-list');
  try {
    const r = await fetch(API+'/leaderboard');
    if(!r.ok) throw new Error();
    const data = await r.json();
    if(!data.length){ el.innerHTML='<div class="lb-empty">No scores yet — be the first!</div>'; return; }
    el.innerHTML = data.map((row,i)=>`
      <div class="lb-row">
        <div class="lb-rank${i<3?' top':''}">${i+1}</div>
        <div class="lb-name">${escHtml(row.name)}</div>
        <div class="lb-pts">${row.score}</div>
      </div>
    `).join('');
  } catch {
    el.innerHTML='<div class="lb-empty">Leaderboard offline — play anyway!</div>';
  }
}

async function submitScore(name, pts){
  try {
    await fetch(API+'/score', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, score:pts})
    });
    setTimeout(fetchLeaderboard, 600);
  } catch {}
}

function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('lb-refresh').addEventListener('click', fetchLeaderboard);
fetchLeaderboard();
